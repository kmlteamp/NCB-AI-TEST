<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#171717;
}
header {
  padding:18px;
  border-bottom:1px solid #eee;
  font-size:20px;
  font-weight:bold;
}
.container {
  max-width:750px;
  margin:25px auto;
  padding:15px;
}
.chat {
  height:65vh;
  min-height:350px;
  border:1px solid #eee;
  border-radius:15px;
  padding:18px;
  overflow-y:auto;
  background:#fafafa;
}
.message {
  padding:13px 16px;
  border-radius:13px;
  margin:12px 0;
  max-width:85%;
  line-height:1.5;
  white-space:pre-wrap;
}
.ai {
  background:white;
  border:1px solid #eee;
}
.user {
  background:#e9efff;
  margin-left:auto;
}
.input-area {
  display:flex;
  gap:10px;
  margin-top:15px;
}
input {
  flex:1;
  padding:15px;
  border:1px solid #ddd;
  border-radius:30px;
  outline:none;
  font-size:15px;
}
button {
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:#171717;
  color:white;
  font-size:20px;
  cursor:pointer;
}
button:disabled {
  opacity:0.5;
  cursor:not-allowed;
}
.typing {
  color:#888;
  font-style:italic;
}
</style>
</head>
<body>
<header>✦ AI Assistant</header>

<div class="container">
  <div class="chat" id="chat">
    <div class="message ai">
      Xin chào! Tôi là AI Assistant.<br>
      Bạn cần tôi giúp gì hôm nay?
    </div>
  </div>

  <div class="input-area">
    <input id="msg" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<script>
// ===== CẤU HÌNH API =====
const API_KEY = "eTYHjgxlNgwKxdEjGM1JqIbNDmWG0BFYu1nisQAE";
// Endpoint AI - thay đổi nếu nhà cung cấp yêu cầu URL khác
const API_URL = "https://api.deepinfra.com/v1/openai/chat/completions";
const MODEL = "meta-llama/Meta-Llama-3.1-8B-Instruct";

// Lịch sử hội thoại
const history = [
  { role: "system", content: "Bạn là AI Assistant thân thiện, trả lời ngắn gọn bằng tiếng Việt." }
];

const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const value = input.value.trim();
  if (!value) return;

  // Hiển thị tin nhắn người dùng
  addMessage(value, "user");
  history.push({ role: "user", content: value });

  input.value = "";
  sendBtn.disabled = true;

  // Hiển thị trạng thái đang gõ
  const typingEl = addMessage("Đang trả lời...", "ai typing");

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        temperature: 0.7,
        max_tokens: 1024
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error("HTTP " + res.status + ": " + errText);
    }

    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || "Xin lỗi, tôi không có phản hồi.";

    typingEl.remove();
    addMessage(reply, "ai");
    history.push({ role: "assistant", content: reply });

  } catch (err) {
    typingEl.remove();
    addMessage("❌ Lỗi kết nối API: " + err.message, "ai");
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
