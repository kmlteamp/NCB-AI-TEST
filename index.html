<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant - Cloudflare</title>
<style>
* {box-sizing:border-box}
body { margin:0; font-family:Arial,sans-serif; background:#fff; color:#171717; }
header { padding:18px; border-bottom:1px solid #eee; font-size:20px; font-weight:bold; }
.container { max-width:750px; margin:25px auto; padding:15px; }
.chat {
  height:65vh; min-height:350px; border:1px solid #eee; border-radius:15px;
  padding:18px; overflow-y:auto; background:#fafafa;
}
.message { padding:13px 16px; border-radius:13px; margin:12px 0; max-width:85%; line-height:1.5; white-space:pre-wrap; }
.ai { background:white; border:1px solid #eee; }
.user { background:#e9efff; margin-left:auto; }
.input-area { display:flex; gap:10px; margin-top:15px; }
input { flex:1; padding:15px; border:1px solid #ddd; border-radius:30px; outline:none; font-size:15px; }
button { width:50px; height:50px; border:0; border-radius:50%; background:#171717; color:white; font-size:20px; cursor:pointer; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.typing { color:#888; font-style:italic; }
</style>
</head>
<body>
<header>✦ AI Assistant (Cloudflare)</header>

<div class="container">
  <div class="chat" id="chat">
    <div class="message ai">
      Xin chào! Tôi là AI Assistant.<br>
      Bạn cần tôi giúp gì hôm nay?
    </div>
  </div>

  <div class="input-area">
    <input id="msg" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<script>
// ===== THAY URL WORKER CỦA BẠN VÀO ĐÂY =====
// Ví dụ: https://ai-proxy.abc123.workers.dev
const WORKER_URL = "https://TEN-WORKER-CUA-BAN.workers.dev";

const history = [
  { role: "system", content: "Bạn là AI Assistant thân thiện, trả lời ngắn gọn bằng tiếng Việt." }
];

const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const value = input.value.trim();
  if (!value) return;

  if (WORKER_URL.includes("TEN-WORKER")) {
    addMessage("❌ Bạn chưa thay WORKER_URL trong code.", "ai");
    return;
  }

  addMessage(value, "user");
  history.push({ role: "user", content: value });

  input.value = "";
  sendBtn.disabled = true;
  const typingEl = addMessage("Đang trả lời...", "ai typing");

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error("HTTP " + res.status + ": " + errText);
    }

    const data = await res.json();

    // Cloudflare trả về { result: { response: "..." } }
    let reply =
      data?.result?.response ||
      data?.choices?.[0]?.message?.content ||
      data?.response ||
      null;

    if (!reply) {
      throw new Error("Không có phản hồi: " + JSON.stringify(data));
    }

    typingEl.remove();
    addMessage(reply.trim(), "ai");
    history.push({ role: "assistant", content: reply.trim() });

  } catch (err) {
    typingEl.remove();
    addMessage("❌ Lỗi: " + err.message, "ai");
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
